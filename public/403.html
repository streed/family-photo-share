<!doctype html>
<html lang="en">
  <head>
    <title>You don't have access to this page (403 Forbidden)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      html { font-size: 16px; }
      body {
        background: #FFF;
        color: #261B23;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: clamp(1rem, 2.5vw, 2rem);
        min-height: 100vh;
        place-items: center;
        text-rendering: optimizeLegibility;
      }
      main { display: grid; gap: 1em; padding: 2em; place-items: center; text-align: center; }
      main article { width: min(100%, 30em); }
      main article p { font-size: 75%; }
      h1 { font-size: clamp(2rem, 6vw, 4rem); }
    </style>
  </head>
  <body>
    <main>
      <article>
        <h1>403</h1>
        <p><strong>You don't have access to this page.</strong> If you believe this is a mistake, contact the album owner or sign in with the account that has access.</p>
      </article>
    </main>
  </body>
</html>
