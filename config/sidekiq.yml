# Sidekiq Configuration
---
# Global settings
:verbose: false
:pidfile: /tmp/sidekiq.pid
:logfile: ./log/sidekiq.log
:concurrency: 5
:timeout: 25

# Queue configuration (in order of priority)
:queues:
  - default
  - image_processing
  - bulk_processing
  - low

# Redis configuration
# Keep this default in step with config/initializers/sidekiq.rb — they disagreed
# (6379 here, 6380 there), so whichever one you read gave the wrong answer.
:redis:
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6380/0") %>
  pool_timeout: 1


# Production settings
production:
  :concurrency: 10
  :queues:
    - [default, 5]
    - [image_processing, 10] 
    - [bulk_processing, 2]
    - [low, 1]

# Development settings  
development:
  :concurrency: 5
  :queues:
    - default
    - image_processing
    - bulk_processing
    - low

# Test settings
test:
  :concurrency: 2
  :queues:
    - default
    - image_processing

# Scheduled jobs live in config/sidekiq_cron_schedule.yml, which
# config/initializers/sidekiq_cron.rb loads. A `:scheduler:` block here is not
# read by sidekiq-cron at all — the one that used to sit here was dead config,
# and it referenced a CleanupJob class that does not exist.